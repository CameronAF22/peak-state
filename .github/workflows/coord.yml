name: coord

# Validates the coordination records on every push and PR, then rebuilds the
# dashboard from every branch and publishes it to the coord-dashboard branch,
# which GitHub Pages serves (Settings → Pages → Deploy from a branch →
# coord-dashboard, / root).

on:
  push:
    branches-ignore: [coord-dashboard]
  pull_request:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests for tools/coord.py
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Records, ownership, decision coverage, spec freshness, append-only decisions
        run: python3 tools/coord.py validate --base origin/main

  dashboard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coord-dashboard
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every branch
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Build the dashboard from all branches
        run: python3 tools/coord.py site --out _site --refs-only --no-fetch
      - name: Publish to the coord-dashboard branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q -b coord-dashboard
          git config user.name "peak-state-dashboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coord-dashboard
