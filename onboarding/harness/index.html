<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030405" />
    <title>Peak State</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23030405'/%3E%3Cellipse cx='16' cy='20' rx='11' ry='3' fill='%23fff' opacity='.35'/%3E%3Crect x='3' y='19.4' width='26' height='1.2' rx='.6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-mood="calm">
    <!-- Horizon (D-onboarding-021): a band of light low on the screen; the steps are points of light on it. -->
    <div class="sky">
      <div class="horizon">
        <div class="aura" aria-hidden="true"></div>
        <div class="band" aria-hidden="true"></div>
        <div class="drift drift-a" aria-hidden="true"></div>
        <div class="drift drift-b" aria-hidden="true"></div>
        <div class="line" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>
        <div class="sweep" id="sweep" aria-hidden="true"></div>
        <aside class="side-col" id="side-col" aria-label="Your strategy"></aside>
      </div>
    </div>

    <header class="corners">
      <h1 class="visually-hidden">Peak State</h1>
      <div class="corner-controls">
        <div class="account" id="account-root" hidden></div>
        <div class="voice" id="voice-root"></div>
      </div>
    </header>

    <main class="stage">
      <section class="main-col" id="main-col" aria-live="polite"></section>
    </main>


    <noscript>This page needs JavaScript.</noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
