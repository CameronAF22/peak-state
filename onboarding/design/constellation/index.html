<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060a" />
    <title>Peak State · Constellation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffffff' opacity='.12'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-mode="elicit">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="stars" class="stars" role="list" aria-label="Your strategy, as stars"></div>

    <nav id="nav" class="nav" aria-label="Question controls"></nav>

    <div id="corner" class="corner">
      <button id="voice-toggle" class="voice-toggle" type="button" data-testid="voice-toggle" aria-expanded="false" aria-controls="voice-panel" title="Voice or typing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
        <span class="voice-word">typing</span>
      </button>
      <div id="voice-panel" class="voice-panel" hidden>
        <div id="voice-root" class="voice-root"></div>
      </div>
    </div>

    <main id="stage" class="stage" aria-live="polite"></main>

    <p class="safety" data-testid="safety-note">A state-recall tool, not therapy or a crisis service. If you are struggling, talk to someone you trust.</p>

    <noscript>This page needs JavaScript.</noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
