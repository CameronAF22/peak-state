<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#040507" />
    <title>Peak State · Horizon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23040507'/%3E%3Crect x='3' y='20' width='26' height='1.5' rx='.75' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The sky: a band of light along the lower part of the screen. Decorative except for the step points. -->
    <div class="sky" id="sky">
      <div class="horizon" id="horizon">
        <div class="aura" aria-hidden="true"></div>
        <div class="band" aria-hidden="true"></div>
        <div class="drift drift-a" aria-hidden="true"></div>
        <div class="drift drift-b" aria-hidden="true"></div>
        <div class="line" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>
        <div class="sweep" id="sweep" aria-hidden="true"></div>
        <ol class="points" id="points" aria-label="Your strategy, in order"></ol>
      </div>
    </div>

    <nav class="corner corner-left" id="nav" aria-label="Question controls"></nav>
    <div class="corner corner-right" id="voice-root"></div>

    <main class="stage" id="stage" aria-live="polite"></main>

    <p class="safety" data-testid="safety-note">
      A practice tool for recalling good states, not therapy. If something feels heavy, talk to someone you trust.
    </p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
